<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>TaskSpeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#D3DCD7; --bg:#EEF2EF; --surface:#FFFFFF; --ink:#15201C; --muted:#5B6863; --line:#D9E1DD;
  --brand:#0E5A4B; --on-brand:#FFFFFF; --gold:#FFC93C; --on-gold:#1B1600;
  --ok-bg:#DDF3E6; --ok-ink:#0B5B36; --warn-bg:#FFF0C7; --warn-ink:#6B4B00; --bad-bg:#FCE1DB; --bad-ink:#9A2A14;
  --tint-s:80%; --tint-l:91%;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:#050908; --bg:#0B120F; --surface:#141F1A; --ink:#EAF2EE; --muted:#9DAEA6; --line:#25342D;
    --brand:#5FD3B6; --on-brand:#06231B;
    --ok-bg:#12382A; --ok-ink:#8BE3B4; --warn-bg:#3B2F0C; --warn-ink:#F5D57A; --bad-bg:#3D1A13; --bad-ink:#FFB4A3;
    --tint-s:32%; --tint-l:22%;
  }
}
:root[data-theme="dark"]{
  --canvas:#050908; --bg:#0B120F; --surface:#141F1A; --ink:#EAF2EE; --muted:#9DAEA6; --line:#25342D;
  --brand:#5FD3B6; --on-brand:#06231B;
  --ok-bg:#12382A; --ok-ink:#8BE3B4; --warn-bg:#3B2F0C; --warn-ink:#F5D57A; --bad-bg:#3D1A13; --bad-ink:#FFB4A3;
  --tint-s:32%; --tint-l:22%;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font:16px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;justify-content:center;align-items:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;text-align:left}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
#app{width:100%;max-width:430px;height:100%;max-height:900px;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media (min-width:500px){#app{height:min(900px,calc(100% - 32px));border-radius:32px;box-shadow:0 20px 60px rgba(0,0,0,.25)}}
.top{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:14px 16px 8px;flex:none}
.logo{width:28px;height:28px;border-radius:9px;background:var(--gold);color:var(--on-gold);display:grid;place-items:center}
.wordmark{font-weight:800;font-size:21px;letter-spacing:-.03em;flex:1;white-space:nowrap}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.ttl{font-weight:800;font-size:19px;letter-spacing:-.02em}
#view{flex:1;overflow-y:auto;padding:8px 16px 28px;-webkit-overflow-scrolling:touch}
.display{font-weight:800;font-size:clamp(30px,4vw,46px);line-height:1.08;letter-spacing:-.035em;margin:8px 0 12px}
h2{font-weight:800;font-size:22px;letter-spacing:-.02em;margin:28px 0 12px}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:12px} .grow{flex:1;min-width:0}
.wrap{display:flex;flex-wrap:wrap;gap:6px 14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;font-weight:700;width:100%;text-align:center;border:2px solid transparent}
.btn.primary{background:var(--gold);color:var(--on-gold);box-shadow:0 8px 18px color-mix(in srgb,var(--gold) 45%,transparent)}
.btn{transition:transform .12s ease,filter .12s ease,box-shadow .12s ease,background .12s ease}
.btn.primary:hover{filter:brightness(1.04)}
.btn.primary:active{transform:translateY(1px)}
.btn.secondary:hover{border-color:var(--brand)}
.btn.big{min-height:58px;font-size:18px}
.btn.secondary{background:var(--surface);border-color:var(--line)}
.btn.ghost{color:var(--brand);min-height:44px}
.btn.danger{background:var(--bad-bg);color:var(--bad-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn+.btn{margin-top:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:block;width:100%;box-shadow:0 8px 24px rgba(21,32,28,.04)}
button.card{text-align:left}
.card.dim{opacity:.55}
.ask{width:100%;text-align:left;background:var(--surface);border:2px solid var(--ink);border-radius:16px;padding:16px;color:var(--muted);margin-bottom:12px;min-height:76px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:64px;justify-content:center}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cats.home-cats{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;margin-inline:auto;align-items:stretch;justify-content:center}
.cats.home-cats .cat{width:100%;height:156px;min-height:156px;max-height:156px;padding:16px 8px 12px;justify-content:flex-start;align-items:center;gap:8px}
.cats.home-cats .ico{width:48px;height:48px}
.cats.home-cats .lbl{display:flex;align-items:center;justify-content:center;width:100%;height:2.4em;min-height:2.4em;max-height:2.4em;margin:0;overflow:hidden;text-align:center;line-height:1.2}
.cats.home-cats .lbl span{display:block;width:100%;max-height:2.4em;overflow:hidden;line-height:1.2;text-align:center}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 8px 12px;text-align:center;font-size:13.5px;font-weight:700;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:10px;min-height:124px;justify-content:flex-start;width:100%;box-shadow:0 8px 20px rgba(21,32,28,.05)}
.cat .ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:hsl(var(--h) var(--tint-s) var(--tint-l));color:var(--brand);flex:none}
.cat .ico svg{width:22px;height:22px;display:block}
.cat .em{display:none}
.cat svg{color:var(--brand)}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.brandtext{display:flex;flex-direction:column;min-width:0}
.tagline{font-size:11px;font-weight:650;color:var(--muted);line-height:1.2}
.top .seg{flex:1 0 100%;display:flex;justify-content:flex-end;margin-left:0}
.perks{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.perk{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.perk svg{color:var(--brand);flex:none}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:124px;border:1.5px dashed var(--line);border-radius:18px;background:var(--surface);cursor:pointer;text-align:center;padding:16px;margin-top:8px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop svg{color:var(--brand)}
.pill.c{display:inline-flex;align-items:center;gap:4px}
.cat .lbl{display:block;min-height:2.4em}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:250px;overflow:auto;margin-top:10px;padding:2px}
.slots .chip{width:100%;justify-content:center;text-align:center}
.pick{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;text-align:left;color:var(--ink);min-height:50px}
.pick .v{font-weight:600}
.pick .ph{color:var(--muted)}
.pick .chev{color:var(--muted);font-size:14px}
.pick.static .chev{display:none}
.datepanel{max-height:430px;overflow:auto;margin-top:10px;padding:2px}
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal.dow{margin-bottom:6px}
.cal.dow span{font-size:11px;text-align:center;color:var(--muted)}
.months .chip,.cal .chip{width:100%;justify-content:center;text-align:center;padding-left:0;padding-right:0}
.cal .chip{padding-top:8px;padding-bottom:8px;font-size:15px;min-height:40px}
.chip[disabled]{opacity:.35;pointer-events:none}
@media print{body *{visibility:hidden}.report,.report *{visibility:visible}.report{position:absolute;left:0;top:0;width:100%}}
.calhead{display:grid;grid-template-columns:46px 1fr 1fr 46px;gap:6px;margin:12px 0 8px}
.calhead .chip{width:100%;justify-content:center;text-align:center;padding:10px 0}
.slots.t4{grid-template-columns:repeat(4,1fr);max-height:52vh}
.slots.t4 .chip{padding-left:0;padding-right:0;font-size:15px}
.sheet .months .chip{padding-top:12px;padding-bottom:12px}
.paper{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.thumbbtn{padding:0;border:0;background:none;cursor:pointer}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.money{position:relative}
.money .cur{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted);pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--line);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink)} .pill.warn{background:var(--warn-bg);color:var(--warn-ink)} .pill.bad{background:var(--bad-bg);color:var(--bad-ink)}
.pill.brand{background:var(--brand);color:var(--on-brand)}
.pill.c{background:hsl(var(--h) var(--tint-s) var(--tint-l));color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14.5px;white-space:nowrap;min-height:40px}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
textarea,input[type=text],input[type=number],input[type=time],input[type=date],input[type=email],input[type=password],input[type=tel],select{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px}
textarea{min-height:120px;resize:vertical}
.money input[type=number]{padding-left:34px!important}
label.f{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)} .kv b{text-align:right;font-weight:600}
.kv b.none{color:var(--muted);font-weight:500}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#15201C;flex:none}
.fee{font-weight:800;font-size:26px;letter-spacing:-.03em}
.quote{margin-top:8px;color:var(--muted);font-size:14.5px}
.notice{border-radius:14px;padding:12px 14px;font-size:14px;background:var(--warn-bg);color:var(--warn-ink)}
.notice.ok{background:var(--ok-bg);color:var(--ok-ink)} .notice.bad{background:var(--bad-bg);color:var(--bad-ink)} .notice.info{background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.notice b{display:block;margin-bottom:2px}
.steps{display:flex;gap:4px;margin:6px 0 4px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)} .steps i.on{background:var(--brand)}
.tl{list-style:none;padding:0;margin-top:6px}
.tl li{display:flex;gap:10px;padding:6px 0;font-size:14px}
.tl li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--brand);margin-top:6px;flex:none}
.tl time{color:var(--muted);margin-left:auto;font-size:12.5px;white-space:nowrap}
.demo{border:2px dashed var(--line);border-radius:16px;padding:14px;margin-top:16px}
.demo-h{font-weight:800;font-size:14px}
.bubble{max-width:82%;padding:10px 13px;border-radius:16px;margin:6px 0;font-size:15px}
.bubble.me{background:var(--brand);color:var(--on-brand);margin-left:auto;border-bottom-right-radius:4px}
.bubble.them{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.stars{display:flex;gap:6px;justify-content:center;margin:8px 0}
.stars button{font-size:38px;line-height:1;color:var(--line);padding:2px}
.stars button.on{color:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-weight:800}
.stat span{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;padding:48px 24px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:20px}
.empty .big{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--brand) 12%,var(--surface));color:var(--brand);font-size:28px}
.dots span{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brand);margin:0 3px;animation:b 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.tog{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%}
.sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.tog[aria-pressed="true"] .sw{background:var(--brand)} .tog[aria-pressed="true"] .sw::after{transform:translateX(18px)}
#nav{display:flex;flex:none;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px 8px}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:700;color:var(--muted);border-radius:12px;min-height:52px;justify-content:center}
#nav button[aria-current="page"]{color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent);box-shadow:inset 0 -2px 0 var(--gold)}
#sheetHost{position:absolute;inset:0;z-index:20;display:none}
#sheetHost.open{display:block}
.back{position:absolute;inset:0;background:rgba(10,18,14,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:8px 18px 26px;animation:up .22s ease-out}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#toast{position:absolute;left:12px;right:12px;top:12px;z-index:30;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:14px;font-size:14.5px;font-weight:600;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{display:block;animation:down .25s ease-out}
@keyframes down{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- Find Tasks: search, sort, list/map ---------- */
.findbar{display:flex;align-items:center;gap:8px;margin-top:8px;position:relative}
.findbar .fsearch{flex:1;min-width:0;margin:0}
.ficon{position:relative;width:48px;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink)}
.ficon[aria-expanded="true"]{border-color:var(--brand);color:var(--brand)}
.fbadge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:var(--gold);color:var(--on-gold);font-size:11px;font-weight:800;display:grid;place-items:center}
.active-filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.active-filters .chip{min-height:32px;padding:4px 10px;font-size:13px}
.results-line{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}
.save-bell{display:inline-flex;align-items:center;gap:4px;color:var(--brand);font-weight:700;font-size:13px;min-height:36px;width:auto}
.find-anchor{position:relative}
.filter-back{display:none}
.filter-pop{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:0;box-shadow:0 16px 40px rgba(21,32,28,.16);display:flex;flex-direction:column;overflow:hidden;max-height:min(78vh,720px);text-align:left}
.filter-body{overflow-y:auto;min-height:0;flex:1 1 auto;padding:18px 16px 8px;-webkit-overflow-scrolling:touch}
.filter-title{margin:0 0 16px;font-size:20px;letter-spacing:-.02em;text-align:left}
.filter-sec{margin:0 0 16px}
.filter-sec:last-child{margin-bottom:8px}
.filter-label{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--muted);text-align:left}
.filter-actions{flex:none;position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 16px;background:var(--surface);border-top:1px solid var(--line)}
.filter-actions .btn{margin:0;width:100%;min-height:48px}
.fseg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;width:100%;padding:4px;background:var(--bg);border-radius:14px}
.fseg.sortgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.catgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.catgrid .fpick:last-child:nth-child(odd){grid-column:1 / -1}
#catgrid.cats .cat:last-child:nth-child(3n+1){grid-column:1 / -1}
.fpick{width:100%;min-width:0;height:44px;padding:0 8px;border:1.5px solid transparent;background:transparent;border-radius:10px;font-weight:700;font-size:13px;color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center}
.fpick span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.fpick.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.catgrid .fpick{background:var(--surface);border-color:var(--line)}
.catgrid .fpick.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
@media (min-width:480px){
  .fseg.sortgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:959px){
  .filter-back{display:block;position:fixed;inset:0;background:rgba(10,18,14,.45);z-index:24}
  .filter-pop{position:fixed;left:0;right:0;bottom:0;z-index:25;margin:0;width:100%;border-radius:24px 24px 0 0;max-height:min(78vh,calc(100dvh - 12px))}
}
@media (min-width:960px){
  .filter-pop{position:absolute;z-index:8;top:calc(100% + 8px);right:0;width:min(440px,100%);max-height:min(70vh,640px)}
}
.fsearch{position:relative;margin:10px 0 2px}
.fsearch>span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex;pointer-events:none}
.fsearch input{padding-left:44px;min-height:50px}
.vt{display:inline-flex;background:var(--line);border-radius:12px;padding:3px;flex:none}
.vt button{padding:7px 14px;border-radius:9px;font-weight:700;font-size:14px;min-height:36px;color:var(--muted)}
.vt button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}

/* ---------- Find Tasks helpers: search, sort, map ---------- */
const SORTS=[['closest','Closest'],['newest','Newest'],['price','Price low'],['pricehi','Price high']];
const SORT_NOTE={closest:'Nearest first.',newest:'Most recently posted first.',price:'Lowest price first.',pricehi:'Highest price first.'};
const STOP=new Set('the and for with need needs someone please help want who can get have that this from near any some one two out off its you your are was has but not too very just like also into onto over'.split(' '));
const postedMins=p=>/min/.test(p)?parseInt(p):/hr/.test(p)?parseInt(p)*60:1440;
function findMatch(t,q){
  q=q.trim().toLowerCase();if(!q)return true;
  const hit=RULES.find(([,re])=>re.test(q));
  const words=q.split(/[^a-z0-9]+/).filter(w=>w.length>2&&!STOP.has(w)).map(w=>w.replace(/(ing|ed|s)$/,''));
  const hay=(t.title+' '+t.desc+' '+t.suburb+' '+(CATS[t.cat]||CATS.other).name).toLowerCase();
  if(hit)return t.cat===hit[0];
  return words.some(w=>w.length>2&&hay.includes(w));
}
function ageMins(t){if(t&&t.at)return Math.max(0,(Date.now()-new Date(t.at).getTime())/60000);return postedMins((t&&t.posted)||'')}
function findList(){
  const f=S.find;
  const rows=allFindTasks().map(t=>{const p=taskPoint(t);return {...t,lat:p.lat,lng:p.lng,km:taskKm(t),priceNum:priceOf(t)}});
  const cmp={closest:(a,b)=>a.km-b.km,newest:(a,b)=>ageMins(a)-ageMins(b),price:(a,b)=>priceOf(a)-priceOf(b),pricehi:(a,b)=>priceOf(b)-priceOf(a)};
  return rows.filter(t=>{
    const distOk=f.km==null?inLaunchZone(t):t.km<=f.km;
    return distOk&&(f.cat==='all'||t.cat===f.cat)&&findMatch(t,f.q||'');
  }).sort(cmp[f.sort||'closest']||cmp.closest);
}
function fpick(label,on,attr,aria){
  return `<button class="fpick${on?' on':''}" aria-pressed="${on?'true':'false'}"${aria?` aria-label="${esc(aria)}"`:''} ${attr}><span>${esc(label)}</span></button>`;
}
function filterCount(f){
  let n=0;
  if(f.km!=null)n++;
  if(f.cat&&f.cat!=='all')n++;
  if((f.sort||'closest')!=='closest')n++;
  if((f.q||'').trim())n++;
  return n;
}
function activeFilterChips(f){
  const bits=[];
  if(f.km!=null)bits.push(`<button class="chip" data-a="fchip" data-v="km" aria-label="Remove ${f.km} km filter">${f.km} km ×</button>`);
  if(f.cat&&f.cat!=='all'&&CATS[f.cat])bits.push(`<button class="chip" data-a="fchip" data-v="cat" aria-label="Remove ${esc(CATS[f.cat].name)} filter">${esc(CATS[f.cat].name)} ×</button>`);
  if((f.sort||'closest')!=='closest'){const label=(SORTS.find(([k])=>k===f.sort)||[])[1]||'Sort';bits.push(`<button class="chip" data-a="fchip" data-v="sort" aria-label="Remove sort">${esc(label)} ×</button>`);}
  if((f.q||'').trim())bits.push(`<button class="chip" data-a="fchip" data-v="q" aria-label="Clear search">“${esc(f.q.trim())}” ×</button>`);
  return bits.join('');
}
function resultsLine(f,l,extra){
  return `<div class="results-line"><p class="muted small" style="margin:0">${l.length} task${l.length===1?'':'s'}${extra||''} · ${SORT_NOTE[f.sort||'closest']}</p><button class="save-bell" data-a="saveSearch" aria-label="Save this search and alert me">${ic('bell',16)}<span>Alert me</span></button></div>`;
}
function findResults(){
  const f=S.find,q=(f.q||'').trim(),l=findList();
  const blocked=q&&BLOCK.find(([re])=>re.test(q));
  if(blocked)return `<div class="notice"><b>Not available on TaskSpeck</b>${esc(blocked[1])}</div>`;
  const hit=q?RULES.find(([,re])=>re.test(q)):null;
  const head=resultsLine(f,l,hit?' · matched to '+(CATS[hit[0]]||CATS.other).name:'');
  if(!l.length){
    return head+empty('search','No tasks near you yet',q?`Nothing matches “${esc(q)}” in this area right now. Try fewer words, a wider distance or another category.`:'New tasks appear here as soon as people post them. Try a wider distance or another category.')
    +(f.km!=null&&f.km<10?`<button class="btn secondary" data-a="fkm" data-v="10">Widen to 10 km</button>`:'')
    +((q||f.cat!=='all')?`<button class="btn ghost" data-a="fclear">Clear search and category</button>`:'');
  }
  return head+(f.view==='map'?mapHtml(l):`<div class="stack">${l.map(taskCard).join('')}</div>`);
}
function mapHtml(l){
  const f=S.find,sel=l.find(t=>t.id===f.pin);
  return `<div class="map" role="region" aria-label="Map of tasks"><div id="jobmap"></div></div>
  <div class="wrap muted small" style="margin:8px 0 12px"><span>You are the dot. Pins are suburbs, not street addresses.</span></div>
  <div id="mappick">${sel?taskCard(sel):'<p class="muted small" style="margin-bottom:10px">Tap a pin to preview the task.</p>'}</div>
  <p class="muted small" style="margin-top:8px">Map data © OpenStreetMap contributors. The exact address is shared only if your offer is accepted.</p>`;
}
function mountJobMap(list){
  const el=document.getElementById('jobmap');
  if(!el)return;
  if(!window.L){setTimeout(()=>mountJobMap(list),250);return}
  if(S._map){try{S._map.remove()}catch(e){}S._map=null}
  const map=window.L.map(el,{scrollWheelZoom:false});
  window.L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
  const me=mePoint();
  const bounds=[[me.lat,me.lng]];
  window.L.circleMarker(me,{radius:7,color:'#0E5A4B',fillColor:'#0E5A4B',fillOpacity:1,weight:2}).addTo(map).bindTooltip('You (approximate)');
  (list||[]).forEach(t=>{
    const icon=window.L.divIcon({className:'leaflet-pin',html:catIcon(t.cat,18),iconSize:[40,40],iconAnchor:[20,20]});
    const marker=window.L.marker([t.lat,t.lng],{icon,title:t.title,keyboard:true}).addTo(map);
    marker.on('click',()=>{S.find.pin=t.id;const box=document.getElementById('mappick');if(box)box.innerHTML=taskCard(t)});
    bounds.push([t.lat,t.lng]);
  });
  if(bounds.length>1)map.fitBounds(bounds,{padding:[28,28],maxZoom:15});
  else map.setView(me,14);
  S._map=map;
  setTimeout(()=>{try{map.invalidateSize()}catch(e){}},80);
}

   if(data.error){notify(data.error);return}
   S.form.password='';

 },
 async logout(){await api('/api/auth/logout',{method:'POST',body:{}});location.href=location.pathname},
 account(){S.form.profName=null;S.form.profPhone=null;S.form.profSuburb=null;S.form.profBio=null;S.form.deleteConfirm='';go('account')},
 async saveProfile(){
   const data=await api('/api/auth/profile',{method:'PATCH',body:{name:S.form.profName,phone:S.form.profPhone,suburb:S.form.profSuburb,bio:S.form.profBio}});

   S.user=data.user;notify('Profile saved.');back();
 },
 async deleteAccount(){
   if((S.form.deleteConfirm||'')!=='DELETE'){notify('Type DELETE to confirm.');return}
   const data=await api('/api/auth/account',{method:'DELETE'});
   if(data.error){notify(data.error);return}
   location.href=location.pathname;
 },
 askOffer(){const o=chosen();if(!o||!S.task)return;openAsk({listingId:S.task.listingId,withName:o.name,title:S.task.title})},
 askAbout(){const t=getFindTask(S.findId);if(!t)return;openAsk({listingId:t.fromApi?t.id:null,withName:t.req.name,title:t.title,localId:t.id})},
 openAsk(v){const th=S.askThreads[+v];if(!th)return;S.ask=th;go('ask')},
 async askSend(){await sendAsk(S.form.msg||'')},
 async saveSearch(){
   const data=await TaskAPI.saveSearch({q:S.find.q||'',cat:S.find.cat||'all',km:S.find.km,sort:S.find.sort||'closest',alert:true});
   if(data.error){notify(data.error);return}
   S.savedSearches=data.savedSearches||S.savedSearches;
   notify('Search saved. We will tell you when a matching task is posted, if it fits your availability.');
   render();
 },
 async searchAlert(v){const s=S.savedSearches.find(x=>x.id===+v);if(!s)return;const data=await TaskAPI.patchSearch(s.id,{alert:!s.alert});if(data.error){notify(data.error);return}S.savedSearches=data.savedSearches;render()},
 async searchDel(v){const data=await TaskAPI.deleteSearch(v);if(data.error){notify(data.error);return}S.savedSearches=data.savedSearches;render()},
 editSent(v){S.editIdx=+v;S.form.editFee=null;S.form.editMsg=null;go('editSent')},
 editSentByTask(v){const i=S.sent.findIndex(s=>s.tid===+v&&s.status!=='withdrawn');if(i<0){notify('No waiting offer to edit.');return}A.editSent(i)},
 async saveSent(){
   const s=S.sent[S.editIdx];if(!s||!s.bidId){notify('This offer is only on this phone.');return}
   const fee=parseFloat(S.form.editFee!=null?S.form.editFee:s.fee);
   const data=await api('/api/bids/'+s.bidId,{method:'PATCH',body:{fee,message:S.form.editMsg!=null?S.form.editMsg:s.message}});
   if(data.error){notify(data.error);return}
   s.fee=data.bid.fee;s.message=data.bid.message;notify('Offer updated.');back();
 },
 async withdrawSent(v){
   const s=S.sent[v!=null?+v:S.editIdx];if(!s)return;
   if(s.bidId){const data=await api('/api/bids/'+s.bidId+'/withdraw',{method:'POST',body:{}});if(data.error){notify(data.error);return}}
   s.status='withdrawn';notify('Offer withdrawn.');if(S.stack[S.stack.length-1].n==='editSent')back();else render();
 },
 withdrawSentByTask(v){const i=S.sent.findIndex(s=>s.tid===+v&&s.status!=='withdrawn');if(i<0)return;A.withdrawSent(i)},
 async shareRecord(){
   const rows=visibleHistory().filter(h=>h.prop===S.propSel);
   if(!rows.length){notify('There is nothing to share yet.');return}
   const saved=await TaskAPI.saveRecords(rows.map(r=>({title:r.title,cat:r.cat,taskerName:r.tasker,date:r.date,paid:r.paid,suburb:'Melbourne CBD',propPrivate:r.prop||'',check:r.check||'',note:r.note||'',photoCount:(r.photos&&r.photos.length)||r.photoCount||0})));
   if(saved.error){notify(saved.error);return}
   const share=await TaskAPI.createShare(saved.ids);
   if(share.error){notify(share.error);return}
   S.shareUrl=location.origin+'/?share='+share.token;
   render();notify('Share link ready. It does not include the street address.');
 },
 async exportCsv(){
   const rows=visibleHistory();
   if(rows.length){const saved=await TaskAPI.saveRecords(rows.map(r=>({title:r.title,cat:r.cat,taskerName:r.tasker,date:r.date,paid:r.paid,suburb:'Melbourne CBD',propPrivate:r.prop||'',check:r.check||'',note:r.note||'',photoCount:(r.photos&&r.photos.length)||r.photoCount||0})));if(saved.error){notify(saved.error);return}}
   location.href='/api/me/records.csv';
 }
};
const OFFPLAT=/\bcash\b|bank transfer|\bbsb\b|pay ?id|paypal|venmo|osko|outside (of )?the app|off the app|don'?t worry about the app|pay me direct|whatsapp|my number|phone number|\b04\d{8}\b|\+61|call me|text me/i;
function openAsk(info){
  S.askThreads=S.askThreads||[];
  let th=S.askThreads.find(t=>(info.listingId&&t.listingId===info.listingId&&t.withName===info.withName)||(info.localId&&t.localId===info.localId&&t.withName===info.withName));
  if(!th){th={listingId:info.listingId||null,localId:info.localId||null,withName:info.withName,title:info.title,messages:[]};S.askThreads.push(th)}
  S.ask=th;go('ask');
}
async function sendAsk(text){
  const body=String(text||'').trim();
  if(!body||!S.ask)return;
  S.form.msg='';
  const warning=OFFPLAT.test(body);
  S.ask.messages.push({from:'me',text:body,warning});
  if(S.ask.listingId){
    const data=await api('/api/tasks/'+S.ask.listingId+'/messages',{method:'POST',body:{text:body}});
    if(data.error){S.ask.messages.pop();notify(data.error);render();return}
    if(data.warning)S.ask.messages[S.ask.messages.length-1].warning=true;
  }
  render();const i=$('#msgin');if(i)i.focus();
}
function sendMsg(text){
  S.thread.push({from:'me',text});
  const off=OFFPLAT.test(text);
  if(off)S.thread.push({sys:true});
  render();const i=$('#msgin');if(i)i.focus();
  if(!off)setTimeout(()=>{
    S.thread.push({from:'them',text:['Sounds good, thanks!','Got it. See you then.','Great, thanks Alex.'][S.thread.length%3]});
    if(S.stack[S.stack.length-1].n==='thread')render();
  },1300);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const f=A[el.dataset.a];if(f)f(el.dataset.v,el,e);
});
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.in;if(!k)return;
  if(k==='idConsent'){S.idc.consent=e.target.checked;return}
  if(k==='tpPhoto'){[...(e.target.files||[])].slice(0,6).forEach(f=>{const r=new FileReader();r.onload=()=>{if(S.tprof.photos.length<6)S.tprof.photos.push(r.result);render()};r.readAsDataURL(f)});return}
  if(k==='postPhoto'){[...(e.target.files||[])].slice(0,5).forEach(f=>{const r=new FileReader();r.onload=()=>{S.draft.photos=S.draft.photos||[];if(S.draft.photos.length<5)S.draft.photos.push(r.result);render()};r.readAsDataURL(f)});return}
  if(k==='proofFile'){[...(e.target.files||[])].slice(0,5).forEach(f=>{const r=new FileReader();r.onload=()=>{S.proof.push({name:f.name,url:r.result});render()};r.readAsDataURL(f)});return}
  const v=e.target.type==='checkbox'?e.target.checked:e.target.value;
  if(k==='text'){S.draft.text=v;queueDraftSave()}
  else if(k==='bamt')S.draft.budgetAmt=v;
  else if(k==='tpbio')S.tprof.bio=v;else if(k==='tpveh')S.tprof.vehicle=v;else if(k==='tpareas')S.tprof.areas=v;else if(k==='abnNum')S.tk.abnNum=v;
  else if(/^vc\d+$/.test(k)){S.checklist[+k.slice(2)]=v;render();return}
  else if(k==='wtime'){S.draft.timeValue=v;if(v)S.draft.answers.part='Time';else if(S.draft.answers.part==='Time')delete S.draft.answers.part;render();return}
  else if(k==='wdate'){S.draft.dateValue=v;if(v)S.draft.answers.date='Custom';else if(S.draft.answers.date==='Custom')delete S.draft.answers.date;render();return}
  else if(k==='afrom')S.avail.from=v;else if(k==='ato')S.avail.to=v;
  else if(k==='tcname')S.trusted.name=v;
  else if(k==='fq'){S.find.q=v;INP.fq();return}
  else if(k==='catQ'){S.catQ=v;const box=$('#catgrid');if(box){const q=String(v||'').trim().toLowerCase();const list=FINAL.filter(c=>!q||CATS[c].name.toLowerCase().includes(q));box.innerHTML=list.length?catGrid(list):'<p class="muted">No category matches. Licensed trades are not listed.</p>'}return}
  else S.form[k]=v;
  if(INP[k])INP[k]();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='msgin'){e.preventDefault();if(S.stack[S.stack.length-1]&&S.stack[S.stack.length-1].n==='ask')A.askSend();else A.send()}
  if(e.key==='Escape'&&S.sheet)closeSheet();
});
async function boot(){
  const share=new URLSearchParams(location.search).get('share');
  if(share){
    S.shareView=share;
    try{const r=await fetch('/api/shares/'+encodeURIComponent(share));S.shareData=await r.json()}catch(e){S.shareData={error:'Could not load this record'}}
    render();return;
  }
  try{const demo=await fetch('/api/demo');if(demo.ok)S.demoInfo=await demo.json()}catch(e){}
  S.serverDemo=!!(S.demoInfo&&S.demoInfo.enabled);
  try{
    const r=await fetch('/api/auth/me',{credentials:'same-origin'});
    if(r.ok){const data=await r.json();if(data.user)applyWorkspace(data)}
  }catch(e){}
  if(!S.user&&S.serverDemo&&S.demoInfo.accounts&&S.demoInfo.accounts[0]){
    try{
      const entered=await api('/api/demo/view',{method:'POST',body:{email:S.demoInfo.accounts[0].email}});
      if(!entered.error){const me=await api('/api/auth/me');if(me.user)applyWorkspace(me)}
    }catch(e){}
  }
  render();
  if(S.user)refreshApiListings();
}
boot();
